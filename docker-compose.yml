services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: train2play
      POSTGRES_PASSWORD: train2play
      POSTGRES_DB: train2play
    ports:
      - "5432:5432"
    volumes:
      - train2play_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U train2play -d train2play"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  train2play_pg:
